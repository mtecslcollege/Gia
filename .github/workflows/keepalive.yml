# Free Supabase projects pause after 7 days without activity. This pings the API twice a week.
# Add repository secrets SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY (Settings > Secrets and variables > Actions).
name: Keep Supabase awake
on:
  schedule: [{ cron: "17 6 * * 1,4" }]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.SUPABASE_URL }}/rest/v1/school_settings?select=id" -H "apikey: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}")
          echo "HTTP $code"; test "$code" = "200"
